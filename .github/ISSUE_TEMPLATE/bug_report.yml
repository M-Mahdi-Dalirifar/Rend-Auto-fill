name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove personal information, credentials, resume contents, and private spreadsheet data before submitting."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Load the extension\n2. Open ...\n3. Click ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Chrome version and operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Do not include tokens or personal data.
